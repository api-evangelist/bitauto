name: Bitauto
description: 'Bitauto (易车, Yiche) is one of China''s largest automotive internet companies, founded in 2000 with the mission of making car ownership simpler. It operates consumer-facing platforms that provide car buyers with pricing, reviews, specifications, and automotive news across new and used vehicles, alongside an enterprise EP (dealer) platform offering web-based digital marketing and CRM applications to Chinese automobile dealers. Bitauto runs regional informational portals across 20+ countries cataloging Chinese car brands. This profile was surfaced as a portfolio company of DCM Ventures; as of enrichment Bitauto publishes no public developer API, SDK, or documentation surface.'
